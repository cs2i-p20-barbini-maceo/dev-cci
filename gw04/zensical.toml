[project]
site_name = "Workflows GitHub"
site_description = "Rétrospective sur les GitHub Actions Workflows"
site_author = "Macéo Barbini"
site_url = "https://cs2i-p20-barbini-maceo.github.io/dev-cci/"

copyright = """
Copyright &copy; 2026 Macéo Barbini
"""

nav = [
  { "Dans quel cadre ?" = "cadre.md" },
  { "À quoi servent-ils ?" = "utilite.md" },
  { "Quels sont leurs intérêts ?" = "interets.md" },
  { "Comment fonctionnent-ils ?" = "fonctionnement.md" },
]

[project.theme]
language = "fr"

features = [
  "navigation.footer",
  "navigation.top",
  "navigation.tracking",
  "content.code.copy",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Passer en mode sombre"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Passer en mode clair"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
