name: CI/CD — Next.js

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # 1. Lint + Tests + Build
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci # plus strict que npm install, idéal pour CI

      - name: Lint
        run: npm run lint # vérifie le code avec ESLint

      - name: Run tests
        run: npm test -- --watchAll=false # lance Jest sans mode watch

      - name: Build
        run: npm run build # vérifie que le build Next.js passe

