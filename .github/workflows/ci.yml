name: CI/CD — Next.js

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────
  # 1. Lint + Tests + Build
  # ─────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm" # met en cache node_modules pour aller plus vite

      - name: Install dependencies
        run: npm ci # plus strict que npm install, idéal pour CI

      - name: Lint
        run: npm run lint # vérifie le code avec ESLint

      - name: Run tests
        run: npm test -- --watchAll=false # lance Jest sans mode watch

      - name: Build
        run: npm run build # vérifie que le build Next.js passe

  # ─────────────────────────────────────────
  # 2. Deploy (uniquement sur push vers main)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-test # attend que le job précédent réussisse
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
